name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run release
      - uses: actions/upload-artifact@v4
        with:
          name: browser-agent-mcp-${{ github.sha }}
          path: release/*.zip
          if-no-files-found: error
